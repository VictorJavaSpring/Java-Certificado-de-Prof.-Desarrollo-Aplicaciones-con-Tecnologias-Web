<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Productes</title>
</h:head>

<h:body>

    <h1>Llistat de Productes</h1>

    <p:dataTable value="#{producteBean.productes}"
                 var="p"
                 paginator="true"
                 rows="10">

        <p:column headerText="ID">
            #{p.id}
        </p:column>

        <p:column headerText="Nom">
            #{p.nom}
        </p:column>

        <p:column headerText="Descripció">
            #{p.descripcioCurta}
        </p:column>

    </p:dataTable>

</h:body>
</html>
