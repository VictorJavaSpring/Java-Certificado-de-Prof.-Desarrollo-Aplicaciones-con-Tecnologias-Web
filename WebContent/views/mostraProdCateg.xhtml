<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Mostra Productes per Categoria</title>
</h:head>

<h:body>
    <h:form id="mostraProdCategForm">
        <p:messages id="msgs" showDetail="true" closable="true" />

        <h1>Productes</h1>

        <h:panelGroup rendered="#{mostraProdCategBean.errorParamCodi}">
<!--             <p:message severity="error" summary="Falta el paràmetre 'codi'." /> -->
			<h:outputText value="Falta el paràmetre 'codi'." />
		</h:panelGroup>

        <h:panelGroup rendered="#{not mostraProdCategBean.errorParamCodi and mostraProdCategBean.errorNoProd}">
<!--             <p:message severity="warn" summary="No hi ha productes per a la categoria indicada." /> -->
            <h:outputText value="No hi ha productes per a la categoria indicada." />
        </h:panelGroup>

        <ui:repeat value="#{mostraProdCategBean.productesFiltrats}" var="prod">
            <p:panel style="margin-bottom:12px;">
                <h:panelGrid columns="2" columnClasses="col-left,col-right" cellpadding="6">
                    <h:graphicImage value="img?accioFoto=get&amp;idProd=#{prod.id}" alt="Producte #{prod.id}" width="120" />
                    <h:panelGroup>
                        <h:outputText value="#{prod.nom}" style="font-weight:bold;display:block;" />
                        <h:outputText value="#{prod.descripcioCurta}" style="display:block;" />
                        <h:outputText value="#{prod.preu}€" style="display:block;" />
                    </h:panelGroup>
                </h:panelGrid>
            </p:panel>
        </ui:repeat>
    </h:form>
</h:body>

</html>
